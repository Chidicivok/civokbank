spring.application.name=civokbank

spring.datasource.url=${DB_URL}
spring.datasource.username=${DB_USERNAME}
spring.datasource.password=${DB_PASSWORD}

spring.jpa.hibernate.ddl-auto=update
spring.jpa.show-sql=true
spring.jpa.properties.hibernate.format_sql = true

jwt.secret=${JWT_SECRET}

super.admin.firstname=${ADMIN_FIRSTNAME}
super.admin.lastname=${ADMIN_LASTNAME}
super.admin.email=${ADMIN_EMAIL}
super.admin.password=${ADMIN_PASSWORD}

abstract.email.api-key=${ABSTRACT_EMAIL_API_KEY}